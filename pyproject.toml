[project]
name = "pyflexcfg"
version = "2.0.0"
description = "Flexible configuration handler for Python projects."
authors = [{ name = "Pavel T", email = "pavelterex@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=43.0.3",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/pavelterex/PyFlexCfg"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-assume>=2.4.3",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyflexcfg"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["temp.py", "dist", ".venv"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # function calls in argument defaults — used intentionally for Path.cwd() fallback
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # allow asserts with messages in tests
