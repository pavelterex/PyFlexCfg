[project]
name = "pyflexcfg"
version = "2.0.0"
description = "Flexible configuration handler for Python projects."
authors = [{ name = "Pavel T", email = "pavelterex@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cryptography>=43.0.3",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/pavelterex/PyFlexCfg"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-assume>=2.4.3",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyflexcfg"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dist", ".venv", "temp_*"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "COM",  # flake8-commas
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "B008",     # function calls in argument defaults — used for Path.cwd() fallback
    "B019",     # cached-instance-method (n/a)
    "B904",     # raise-without-from-inside-except (project convention)
    "COM812",   # missing-trailing-comma — handled by the formatter, conflicts when both run
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLW2901",  # redefined-loop-name
    "PT013",    # pytest-incorrect-pytest-import — we use `from pytest import param`
    "RET503",   # implicit-return
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG002",   # pytest fixture-name parameters
    "B011",     # allow asserts with messages
    "PLR2004",  # magic value comparisons are the point of a test
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.pycodestyle]
max-doc-length = 88  # enforces W505 for docstrings/comments
